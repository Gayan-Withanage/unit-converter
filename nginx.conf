# =============================================================================
# nginx.conf - Custom Nginx Configuration
# Unit Converter Web Application
# =============================================================================
# This configuration file defines how nginx serves the static application.
# It includes performance optimisations (gzip, caching) and security headers.
# =============================================================================

server {
    # Listen on port 80 for incoming HTTP connections.
    listen 80;

    # Server name — accepts any hostname (suitable for containerised deployment).
    server_name localhost;

    # Root directory where static files are located inside the container.
    root /usr/share/nginx/html;

    # Default file to serve when a directory is requested.
    index index.html;

    # ---------------------------------------------------------------------------
    # Gzip Compression
    # Compresses responses before sending to reduce bandwidth and improve
    # load time for users. Text-based assets (HTML, CSS, JS) compress well.
    # ---------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml text/xml;

    # ---------------------------------------------------------------------------
    # Security Headers
    # These headers instruct the browser to apply additional protections,
    # reducing exposure to common web vulnerabilities.
    # ---------------------------------------------------------------------------

    # Prevent the page from being embedded in an iframe (clickjacking protection).
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Enable browser-side XSS filtering.
    add_header X-XSS-Protection "1; mode=block" always;

    # Prevent MIME-type sniffing (forces browser to use declared content type).
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer Policy: only send referrer info to same origin.
    add_header Referrer-Policy "same-origin" always;

    # ---------------------------------------------------------------------------
    # Static File Caching
    # Cache HTML files for a short period; cache assets (CSS/JS) longer.
    # This balances performance with the need to serve updated content.
    # ---------------------------------------------------------------------------
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.(ico|png|jpg|jpeg|gif|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ---------------------------------------------------------------------------
    # SPA Fallback (Single Page Application support)
    # Redirects all unmatched routes to index.html, enabling client-side routing.
    # For a static multi-page app this is also safe — any missing path returns
    # the main page rather than a 404.
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------------------
    # Hide nginx version from response headers (security hardening).
    # ---------------------------------------------------------------------------
    server_tokens off;
}
